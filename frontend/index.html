<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amigo Secreto</title>
    <meta name="description" content="Organize o seu amigo secreto: sorteio online, um link secreto para cada pessoa pelo WhatsApp e lista de desejos." />
    <meta name="theme-color" content="#15803d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Permite instalar o site na tela inicial do celular, abrindo como um app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Aplica o tema antes do app carregar (evita a tela piscar clara no modo escuro).
      try {
        var tema = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', tema);
      } catch (e) {}
    </script>

    <!-- Prévia do link no WhatsApp e nas redes sociais. A imagem (og:image) precisa do endereço
         completo do site: o Django a acrescenta ao entregar a página (veja vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amigo Secreto" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Amigo Secreto" />
    <meta property="og:description" content="Sorteio online com um link secreto para cada pessoa. Descubra quem você tirou e deixe a sua lista de desejos." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
